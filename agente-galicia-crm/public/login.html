<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — Agente Galicia CRM</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>Agente <span style="color:var(--accent)">Galicia</span> CRM</h1>
    <div class="sub">Inicia sesión para continuar</div>
    <form id="form">
      <label class="field"><span>Usuario</span>
        <select id="username">
          <option value="andre">André</option>
          <option value="cristina">Cristina</option>
        </select>
      </label>
      <label class="field"><span>Contraseña</span>
        <input id="password" type="password" required autocomplete="current-password" />
      </label>
      <button type="submit" class="block">Entrar</button>
      <div class="login-error" id="error"></div>
    </form>
  </div>
</div>
<script>
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const errBox = document.getElementById("error");
    errBox.textContent = "";
    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        errBox.textContent = data.error || "Credenciais inválidas.";
        return;
      }
      location.href = "./";
    } catch (err) {
      errBox.textContent = "Erro de ligação.";
    }
  });
</script>
</body>
</html>
